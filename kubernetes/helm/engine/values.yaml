# Default values for distributed-execution-engine.

replicaCount: 1

image:
  repository: anilmarneni/execution-engine
  pullPolicy: IfNotPresent
  tag: "latest"

services:
  api:
    port: 3000
    replicas: 2
  scheduler:
    port: 3001
    replicas: 1
  worker:
    port: 4000
    replicas: 3
  evaluation:
    replicas: 1
  result:
    replicas: 1

kafka:
  brokers: "kafka:9092"

postgres:
  host: "postgres"
  db: "engine_db"
  user: "user"
  password: "password"

redis:
  host: "redis"
  port: 6379

monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
